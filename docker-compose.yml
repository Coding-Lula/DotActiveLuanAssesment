services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotactiv_sql_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotactiv_api
    ports:
      - "5154:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=DotActivDashboard;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
      - Jwt__Key=SuperSecretKeyForDotActivAssessment123!
    depends_on:
      db:
        condition: service_healthy
    restart: always

  web:
    image: nginx:alpine
    container_name: dotactiv_frontend
    ports:
      - "8080:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
    restart: always

volumes:
  mssql_data: